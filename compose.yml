name: sarvesh-illam

services:
  dashboard:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "1984:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./deploy/dashboard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/runtime-config.docker.js:/usr/share/nginx/html/runtime-config.js:ro

  home:
    build:
      context: .
      dockerfile: alerts/Dockerfile.home
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      SARVESH_CONFIG_DIR: /config
      SARVESH_DATA_DIR: /data
      HOME_API_PORT: 8090
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-http://127.0.0.1:8123}
    volumes:
      - ./alerts/config.yaml:/config/config.yaml:ro
      - ./alerts/config.local.yaml:/config/config.local.yaml:ro
      - ./data/home:/data

  cctv:
    # Pinned to match the vendored player files in www/ (go2rtc v1.9.14, see README).
    image: ghcr.io/alexxit/go2rtc:v1.9.14
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    command: ["-config", "/config/go2rtc.yaml"]
    ports:
      - "1985:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
      - ./www:/config/www:ro

  alerts:
    build:
      context: .
      dockerfile: alerts/Dockerfile.alerts
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SARVESH_CONFIG_DIR: /config
      SARVESH_DATA_DIR: /data
      ALERTS_API_PORT: 8091
      ALERTS_HOME_ENABLED: 0
      GO2RTC_RTSP: rtsp://host.docker.internal:8554
    ports:
      - "8091:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./alerts/config.yaml:/config/config.yaml:ro
      - ./alerts/config.local.yaml:/config/config.local.yaml:ro
      - ./data/alerts:/data

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Indiana/Indianapolis}
    ports:
      - "8123:8123"
    volumes:
      - ./data/homeassistant:/config
